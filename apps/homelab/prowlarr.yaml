apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  dependsOn:
    - name: clusterissuer
      namespace: default
    - name: longhorn
      namespace: longhorn-system
    - name: gluetun
      namespace: gluetun
    - name: flaresolverr
      namespace: flaresolverr
  interval: 30m
  releaseName: prowlarr
  targetNamespace: prowlarr
  storageNamespace: prowlarr
  chart:
    spec:
      chart: ./charts/prowlarr
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    hostName: prowlarr.nishiol.ru
    certIssuer: prod-issuer
    timezone: Europe/Moscow
    persistence:
      size: 1Gi
    nodeSelector:
      cpu: medium
