apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        fsGroup: {{ .Values.pgid }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-media-directories
          image: {{ .Values.mediaInitializer.image | quote }}
          command:
            - sh
            - -ec
          args:
            - |
              for directory do
                mkdir -p "${directory}"
                chown 0:{{ .Values.pgid }} "${directory}"
                chmod 2775 "${directory}"
                if [ ! -e "${directory}/.anchor" ]; then
                  touch "${directory}/.anchor"
                fi
                chown {{ .Values.puid }}:{{ .Values.pgid }} "${directory}/.anchor"
                chmod 0664 "${directory}/.anchor"
              done
            - prepare-media-directories
            {{- range .Values.mediaInitializer.directories }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: media
              mountPath: /data
      containers:
        - name: qbittorrent
          image: "linuxserver/qbittorrent:{{ .Values.qbittorrent.imageTag }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 6881
              protocol: UDP
            - containerPort: 6881
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: qbittorrent
            - name: media
              mountPath: /data
            {{- if .Values.additionalVolumeMounts }}
              {{ toYaml .Values.additionalVolumeMounts | nindent 12 }}
            {{- end }}
        - name: sonarr
          image: "linuxserver/sonarr:{{ .Values.sonarr.imageTag }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
          ports:
            - containerPort: 8989
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: sonarr
            - name: media
              mountPath: /data
            {{- if .Values.additionalVolumeMounts }}
              {{ toYaml .Values.additionalVolumeMounts | nindent 12 }}
            {{- end }}
        - name: radarr
          image: "linuxserver/radarr:{{ .Values.radarr.imageTag }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
          ports:
            - containerPort: 7878
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: radarr
            - name: media
              mountPath: /data
            {{- if .Values.additionalVolumeMounts }}
              {{ toYaml .Values.additionalVolumeMounts | nindent 12 }}
            {{- end }}
        - name: jellyfin
          image: "linuxserver/jellyfin:{{ .Values.jellyfin.imageTag }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
            - name: JELLYFIN_PublishedServerUrl
              value: "https://{{ .Values.jellyfin.hostName }}"
            - name: DOCKER_MODS
              value: "linuxserver/mods:jellyfin-opencl-intel"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-proxy
          ports:
            - containerPort: 8096
              protocol: TCP
            - containerPort: 7359
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: jellyfin
            - name: media
              mountPath: /data
            - name: dri
              mountPath: /dev/dri
            - name: transcodes
              mountPath: /config/cache/transcodes
            {{- if .Values.additionalVolumeMounts }}
              {{ toYaml .Values.additionalVolumeMounts | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: true
        - name: filebrowser
          image: "filebrowser/filebrowser:{{ .Values.filebrowser.imageTag }}"
          env:
            - name: FB_DISABLE_EXEC
              value: "true"
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: filebrowser/config
            - name: config
              mountPath: /database
              subPath: filebrowser/database
            - name: media
              mountPath: /srv/media
            {{- if .Values.additionalFileBrowserVolumeMounts }}
              {{ toYaml .Values.additionalFileBrowserVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
        - name: dri
          hostPath:
            path: /dev/dri
        - name: transcodes
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.jellyfin.transcodeCacheSize }}
        {{- if .Values.additionalVolumes }}
          {{ toYaml .Values.additionalVolumes | nindent 8 }}
        {{- end }}
